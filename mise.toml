[tools]
node = "26"
python = "3.14"
"npm:rulesync" = "16.24.0"

[tasks."rulesync:verify"]
description = "curated skill が rulesync.lock と一致するか検証（読み取りのみ）"
run = 'GITHUB_TOKEN="$(gh auth token)" rulesync install --frozen'

# pi / omp は exact pin なので mise outdated / up の対象外。引き上げはここ経由のみ
# （danger-rules の agent-cli-unpinned-install が npm -g / mise use 直叩きを block する）。
[tasks."agents:outdated"]
description = "pi / omp の pin と npm latest を並べる（読み取りのみ）"
run = "python3 scripts/agents-update.py outdated"

[tasks."agents:update"]
description = "pi / omp の pin を引き上げて検証。例: mise run agents:update -- pi 0.84.3"
run = "python3 scripts/agents-update.py update"

[tasks."pi-packages:outdated"]
description = "pi 拡張（targets/pi/settings.json の packages）の pin と npm latest / git HEAD を並べる"
run = "python3 scripts/pi-packages-update.py outdated"

[tasks."pi-packages:update"]
description = "pi 拡張の pin を latest へ引き上げて検証。例: mise run pi-packages:update -- pi-lens"
run = "python3 scripts/pi-packages-update.py update"
