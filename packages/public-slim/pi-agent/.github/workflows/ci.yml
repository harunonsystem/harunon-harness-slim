name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck rsync
      - name: Validate
        run: ./scripts/validate.sh
      - name: Install into a scratch directory
        run: |
          set -euo pipefail
          ./scripts/install.sh --dest "${RUNNER_TEMP}/pi-agent" --dry-run
          ./scripts/install.sh --dest "${RUNNER_TEMP}/pi-agent"
          ./scripts/install.sh --dest "${RUNNER_TEMP}/pi-agent" --check
