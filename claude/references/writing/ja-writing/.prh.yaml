version: 1
rules:
  # 予告・総括
  - expected: "（削除するか具体的な内容に書き換える）"
    pattern: /重要なのは、?/
  - expected: "（節の内容を要約する見出し・冒頭文に書き換える）"
    pattern: /本章では/
  - expected: "（削除するか具体的な内容に書き換える）"
    pattern: /ここでは、?.{0,20}について見てい(く|きます|きましょう)/
  - expected: "（削除するか具体的な内容に書き換える）"
    pattern: /要するに、?/
  - expected: "（削除するか具体的な内容に書き換える）"
    pattern: /結論から(言う|いう|申し上げる)と、?/

  # 中身のない形容
  - expected: "（何を対象に何をするかを具体的に書く）"
    pattern: /包括的/
  - expected: "（削除するか、必要性を明示した具体的な表現に書き換える）"
    pattern: /不可欠/
  - expected: "（具体的な観点を列挙する表現に書き換える）"
    pattern: /多角的/
  - expected: "（何が核心かを具体的に書く）"
    pattern: /核心的(な|である|だ|です|でした)/
  - expected: "（具体的に何をするかを明示する表現に書き換える）"
    pattern: /掘り下げ/
  - expected: "（何をどう書いたかを具体的に示す）"
    pattern: /深掘り/

  # 演出的な言い換え
  - expected: "（言い換えを削除し、主張をそのまま書く）"
    pattern: /に他な(らない|りません)/

  # 二重否定
  # preset-ja-technical-writing/no-double-negative-ja は終止形の連接した二重否定しか拾わないため、
  # 分離型と丁寧形をここで補う。
  - expected: "（肯定に畳む。真偽を反転させない）"
    pattern: /ないとは(言え|いえ)(ない|ません)/
  - expected: "（肯定に畳む。真偽を反転させない）"
    pattern: /なくはない/
  # 統計の「（帰無）仮説は否定できない」は検定の結論であり畳めないため、直前15文字以内
  # （句読点を挟まない）に「仮説」がある場合を除外する。
  - expected: "（肯定に畳む。真偽を反転させない）"
    pattern: /(?<!仮説[^。、]{0,15})否定でき(ない|ません)/
  - expected: "（肯定に畳む。真偽を反転させない）"
    pattern: /ないわけが(ない|ありません)/
  - expected: "（肯定に畳む。真偽を反転させない）"
    pattern: /ないわけではありません/
  - expected: "（肯定に畳む。真偽を反転させない）"
    pattern: /ないと(は|も)限りません/
  - expected: "（肯定に畳む。真偽を反転させない）"
    pattern: /ないこと(は|も)ありません/
  - expected: "（肯定に畳む。真偽を反転させない）"
    pattern: /なく(は|も)ありません/

  # 気取った表現
  - expected: "（何を根拠にしたかを具体的に書く）"
    pattern: /事実ベース/
  - expected: "（どの条件・場面の話かを具体的に書く）"
    pattern: /実務的/

  # 英語表現の直訳
  - expected: "（発生する事象を具体的に書く。例: 不正な状態を検知できない）"
    pattern: /静かに(壊れ|失敗|落ち|消え|無視)/
  - expected: "（発生する事象を具体的に書く。例: エラーにならず処理されない）"
    pattern: /黙って(無視|捨て|握りつぶ|失敗)/
  - expected: "安全を優先する"
    pattern: /安全側に倒(す|し|せ|れ)/
  - expected: "（マスターデータ・○○の値を使用する等、具体的に書く）"
    pattern: /信頼できる唯一の情報源/
  - expected: "（マスターデータ・○○の値を使用する等、具体的に書く）"
    pattern: /(?<![謄抄])正本(?!・副本)/

  # 比喩的な名詞
  # 単独の名詞の規則は、動詞の連用形に続く複合語（「蒸し器」「取り出し口」等）を除外する。
  # 「取る口」のような連体形（ウ段）に続く場合は検出する。
  # 口（熟語・「入り口」は除外）
  - expected: "（エンドポイント・インターフェイス・出力設定等、対象を具体的に書く）"
    pattern: /(?<![一-龯々][いきぎしじちにびみりえけげせぜてでねべめれ])(?<![一-龯々]|入り)口(?![一-龯々])/
  # 枝
  - expected: "ブランチ"
    pattern: /(?<![一-龯々][いきぎしじちにびみりえけげせぜてでねべめれ])(?<![一-龯々])枝(?![一-龯々])/
  # 腕
  - expected: "（具体的な技術・経験を書く）"
    pattern: /(?<![一-龯々][いきぎしじちにびみりえけげせぜてでねべめれ])(?<![一-龯々])腕(?![一-龯々])/
  # 窓
  - expected: "ウィンドウ"
    pattern: /(?<![一-龯々][いきぎしじちにびみりえけげせぜてでねべめれ])(?<![一-龯々])窓(?![一-龯々])/
  # 版（「最新版」「第2版」「日本語版」「ベータ版」等の複合語は除外）
  - expected: "バージョン"
    pattern: /(?<![一-龯々0-9０-９A-Za-zＡ-Ｚａ-ｚァ-ヶー])版(?![一-龯々])/
  # 入口
  - expected: "エントリポイント"
    pattern: /入り?口/
  # 出口
  - expected: "（出力先・終了処理等、対象を具体的に書く）"
    pattern: /出口/
  # 箱（「ゴミ箱」等の複合語は除外）
  - expected: "（コンテナ・環境・サーバー等、対象を具体的に書く）"
    pattern: /(?<![一-龯々][いきぎしじちにびみりえけげせぜてでねべめれ])(?<![一-龯々ァ-ヶー])箱(?![一-龯々])/
  # 器
  - expected: "（格納先・型等、対象を具体的に書く）"
    pattern: /(?<![一-龯々][いきぎしじちにびみりえけげせぜてでねべめれ])(?<![一-龯々])器(?![一-龯々])/
  # 土台
  - expected: "（基盤となる○○等、対象を具体的に書く）"
    pattern: /土台/
  - expected: "（実際の処理・役割を書く）"
    pattern: /門番/
  - expected: "（実際の処理・役割を書く）"
    pattern: /砦/
  - expected: "（取得元・入力元等の具体的な名詞を書く）"
    pattern: /源泉(?!徴収|かけ流し)/

  # 比喩的な動詞
  - expected: "（呼び出す・実行する・送信する等に書き換える）"
    pattern: /(API|エンドポイント|URL|サーバー?|コマンド|DB|データベース)を叩/
  - expected: "（停止する・異常終了する等に書き換える）"
    pattern: /(プロセス|サーバー?|コンテナ|ジョブ|ワーカー|Pod|ノード)が死(ぬ|ん|な)/
  # 比喩的な動詞は全ての活用形を検出する。
  # 漢字1字の語幹は、前に漢字がある場合（「満足し」「共通し」等）を熟語として除外する。
  # 足す
  - expected: "追加する"
    pattern: /(?<![一-龯々])足(?!し算)[さしすせそ]/
  # 効く
  - expected: "（何が良くなったかを具体的に書く）"
    pattern: /(?<![一-龯々])効[かきくけこい]/
  # 利く
  - expected: "有効になる・機能する"
    pattern: /(?<![一-龯々])利[かきくけこい]/
  # 捨てる（「切り捨て」は端数処理の用語のため除外）
  - expected: "破棄する・削除する"
    pattern: /(?<![一-龯々])(?<!切り)捨て/
  # 飛ばす
  - expected: "スキップする・省略する・送信する"
    pattern: /飛ば[さしすせそ]/
  # 通す（「通し番号」は除外）
  - expected: "渡す・許可する・通過させる"
    pattern: /(?<![一-龯々])通(?!し番号)[さしすせそ]/
  # 落とす
  - expected: "停止する・削除する・ダウンロードする"
    pattern: /(?<![一-龯々])落と[さしすせそ]/
  # 踏む（「踏まえる」は除外）
  - expected: "（発生した事象を具体的に書く。例: 不具合が発生する・○○を経由する）"
    pattern: /(?<![一-龯々])踏(?!まえ)[まみむめもん]/
  # 尽きる
  - expected: "上限に達する・残量が無くなる"
    pattern: /(?<![一-龯々])尽き/
  # 抑える
  - expected: "削減する・制限する"
    pattern: /(?<![一-龯々])抑え/
  # 絞る
  - expected: "限定する・制限する"
    pattern: /(?<![一-龯々])絞[らりるれろっ]/
  # 緩める
  - expected: "条件を変更する・制限を解除する"
    pattern: /(?<![一-龯々])緩め/
  # 張る
  - expected: "作成する・設定する"
    pattern: /(?<![一-龯々])張[らりるれろっ]/
  # 壊す
  - expected: "破損させる・不正な状態にする"
    pattern: /(?<![一-龯々])壊[さしすせそ]/
  # 弾く
  - expected: "拒否する・除外する"
    pattern: /(?<![一-龯々])弾[かきくけこい]/
  # 委ねる
  - expected: "（処理を実行する主体を書く。例: ○○が処理する）"
    pattern: /委ね/
  # 打ち切る
  - expected: "中止する・終了する"
    pattern: /打ち?切[らりるれろっ]/
  # 組み立てる
  - expected: "構築する・生成する"
    pattern: /組み?立て/
  # 要る
  - expected: "必要である"
    pattern: /(?<![一-龯々])要[らりるれろっ]/
  # 乗る・乗せる
  - expected: "追加する・含める・実行する"
    pattern: /(?<![一-龯々])乗(せ|[らりるれろっ])/
  # 割る（「割り当て」「割り込み」は用語のため除外）
  - expected: "下回る・分割する"
    pattern: /(?<![一-龯々])割(?!り当て|り込)[らりるれろっ]/
  # 撃つ
  - expected: "送信する・実行する"
    pattern: /(?<![一-龯々])撃[たちつてとっ]/
  # 捌く
  - expected: "処理する"
    pattern: /(?<![一-龯々])捌[かきくけこい]/
  # 借りる
  - expected: "利用する"
    pattern: /(?<![一-龯々])借り/
  # 貼る（「貼り付け」は操作の名称のため除外）
  - expected: "記載する・添付する"
    pattern: /(?<![一-龯々])貼(?!り付け|りつけ)[らりるれろっ]/
  # 流す
  - expected: "実行する・出力する・送信する"
    pattern: /(?<![一-龯々])流[さしすせそ]/
  # 断る
  - expected: "拒否する"
    pattern: /(?<![一-龯々])断[らりるれろっ]/
  # 許す
  - expected: "許可する・受け入れる"
    pattern: /(?<![一-龯々])許[さしすせそ]/
  # 差し込む
  - expected: "挿入する・追加する"
    pattern: /差し?込[まみむめもん]/
  # 噛ませる・噛ます
  - expected: "間に配置する・経由させる"
    pattern: /噛ま[さしすせそ]/
  # 生やす
  - expected: "追加する・作成する"
    pattern: /生や[さしすせそ]/
  # 寄せる
  - expected: "統合する・移動する"
    pattern: /(?<![一-龯々])寄せ/
  # 畳む
  - expected: "統合する・削除する"
    pattern: /(?<![一-龯々])畳[まみむめもん]/
  # 剥がす
  - expected: "削除する・除去する"
    pattern: /剥が[さしすせそ]/
  # 潰す
  - expected: "修正する・解消する・削除する"
    pattern: /(?<![一-龯々])潰[さしすせそ]/
  # 握る
  - expected: "保持する・管理する"
    pattern: /(?<![一-龯々])握[らりるれろっ]/
  # 拾う
  - expected: "取得する・検出する"
    pattern: /(?<![一-龯々])拾[わいうえおっ]/

  # 擬人化
  - expected: "（エラーになる・警告が出る等、発生する事象を書く）"
    pattern: /(に|から)怒られ/
  - expected: "（検知されない・検出されない等に書き換える）"
    pattern: /気づかれ(ない|ず|にくい)/

  # ユーザーへの同意・評価・称賛
  - expected: "（削除して事実と結論から書く）"
    pattern: /(おっしゃる|仰る|ご指摘の)(通り|とおり)/
  - expected: "（削除して事実と結論から書く）"
    pattern: /(?<=^|[。、「（！？\s])なるほど/
  - expected: "（削除して事実と結論から書く）"
    pattern: /(良い|いい|鋭い)(質問|ご質問|ご指摘|指摘)/

  # 正式名称に書き換える専門用語
  - expected: "サンドボックス"
    pattern: /砂場/
  - expected: "アーキテクチャ"
    pattern: /(?<![ァ-ヶー])アーキ(?!テクチャ|タイプ)/
  - expected: "リポジトリ"
    pattern: /(?<![ァ-ヶー])リポ(?!ジトリ|ート|ーター)/
  - expected: "ドキュメント"
    pattern: /(?<![ァ-ヶー])ドキュ(?!メン(ト|タリー|テーション))/
