# implement-issue 設定
# config.yml にコピーして環境に合わせて編集すること。
# スキル実行時に config.yml が Read される。

# メインリポジトリのパス（単一リポジトリ運用）
main_repo: ~/projects/your-project

# 複数リポジトリ運用の場合: issue ID の prefix (例: ABC-123 の "ABC") → リポジトリパス
# 定義されている場合は main_repo より優先される
# repos:
#   ABC: ~/projects/repo-a
#   XYZ: ~/projects/repo-b

# 任意の管理コマンド（add --from <base> <branch> に対応すること）
# 未設定なら runtime 標準機能か git worktree add -b を使う。Git はこのキーに指定しない。
worktree_cmd: null

# PR Templateのパス（リポジトリルートからの相対パス）
pr_template: .github/PULL_REQUEST_TEMPLATE.md

# lint修正コマンド
# example: pnpm run lint:write, npm run lint -- --fix
lint_fix_cmd: pnpm run lint:write
