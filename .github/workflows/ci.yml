name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck rsync
      - name: Validate payloads
        run: scripts/validate.sh
      - name: Install every target into a scratch directory
        run: |
          set -euo pipefail
          for manifest in */install-manifest.json; do
            target="$(dirname "$manifest")"
            dest="${RUNNER_TEMP}/${target}"
            scripts/install.sh "$target" --dest "$dest" --dry-run
            scripts/install.sh "$target" --dest "$dest"
            scripts/install.sh "$target" --dest "$dest" --check
          done
